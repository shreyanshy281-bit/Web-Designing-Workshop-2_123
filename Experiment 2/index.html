<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox and CSS Grid Layout</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header{
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Flexbox Navigation */

        nav{
            display: flex;
            justify-content: center;
            background-color: #212529;
            padding: 15px;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        /* CSS Grid Layout */

        .grid-container{

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            padding: 30px;
        }

        .box{

            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0px 0px 10px gray;

            text-align: center;
        }

        footer{

            background-color: #0d6efd;

            color: white;

            text-align: center;

            padding: 15px;

            margin-top: 20px;
        }

        /* Responsive Design */

        @media(max-width:768px){

            .grid-container{

                grid-template-columns: 1fr;
            }

            nav{

                flex-direction: column;
                align-items: center;
            }

            nav a{

                margin: 10px 0;
            }
        }

    </style>

</head>

<body>

    <!-- Header -->

    <header>

        <h1>Flexbox and Grid Example</h1>

        <p>Responsive Layout using CSS</p>

    </header>

    <!-- Navigation -->

    <nav>

        <a href="#">Home</a>

        <a href="#">About</a>

        <a href="#">Services</a>

        <a href="#">Contact</a>

    </nav>

    <!-- Grid Section -->

    <div class="grid-container">

        <div class="box">

            <h2>HTML</h2>

            <p>
                HTML is used to create the structure
                of web pages.
            </p>

        </div>

        <div class="box">

            <h2>CSS</h2>

            <p>
                CSS is used for styling and layout
                design.
            </p>

        </div>

        <div class="box">

            <h2>JavaScript</h2>

            <p>
                JavaScript adds interactivity to
                webpages.
            </p>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        <p>© 2026 Web Development Lab</p>

    </footer>

</body>
</html>
